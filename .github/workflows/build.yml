name: Build

# Artifacts-only build on branch pushes: no write permission, no publish token.
# Releases are handled by release.yml (tag-gated, requires smoke to pass) — see
# docs/reviews/2026-10-23-code-review.md pass-2 P2 and the fix-branch review.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    timeout-minutes: 45

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: npm ci
        shell: bash

      # GH_TOKEN intentionally absent: without it electron-builder skips the
      # GitHub publish step and writes artifacts to dist/ only.
      - name: Build
        run: npm run dist
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/latest*.yml
